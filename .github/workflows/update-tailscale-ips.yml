name: Update Tailscale DERP IPs

on:
  schedule:
    - cron: '0 12 * * *' # Daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need HEAD + its parent so the keepalive amend/force-push has a real
          # parent object to reattach to (the default shallow depth-1 does not).
          fetch-depth: 2

      - name: Fetch and parse DERP map
        run: |
          set -euo pipefail

          curl --config fetch-derpmap.curlrc

          jq --from-file derpmap-to-lsrules.jq derpmap.json > derpmap.lsrules

          #rm -f derpmap.json

      - name: Commit and push (rolling keepalive if unchanged)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          DATE=$(date -u +%Y-%m-%d)

          if ! git diff --cached --quiet; then
            # DERP IPs changed -- record a real commit and push normally.
            git commit -m ".lsrules for DERP servers as of ${DATE}"
            git push
            exit 0
          fi

          # No DERP changes. Keep the repo active WITHOUT growing history:
          # GitHub disables scheduled workflows after 60 days of repo
          # inactivity, and scheduled runs alone do NOT count as activity.
          # If the tip is already a keepalive commit, rewrite it in place
          # (amend + force-push) so there is only ever one at the tip;
          # otherwise add a single fresh keepalive commit on top.
          MSG="${DATE} - keep github workflow alive"
          case "$(git log -1 --pretty=%s)" in
            *"keep github workflow alive")
              # --allow-empty: the keepalive commit has no file changes, and
              # amend otherwise refuses to produce an empty commit.
              git commit --amend --allow-empty --date=now -m "$MSG"
              git push --force-with-lease
              ;;
            *)
              git commit --allow-empty -m "$MSG"
              git push
              ;;
          esac
